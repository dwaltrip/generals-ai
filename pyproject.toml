[project]
name = "generals-ai-workspace"
version = "0.0.0"
description = "generals-ai monorepo workspace root"
requires-python = ">=3.14"
dependencies = [
    "modal>=1.4.3",
    "eval-bot",
    "eval-tools",
    "game-runner",
    "game-types",
    "replay-collector",
    "replay-parser",
    "self-play",
    "sim-core",
    "settings",
    "training",
    "utils",
]

[tool.uv]
package = false

# Convention: new shared/leaf packages go under `packages/` (e.g.
# `packages/utils/utils/`). Putting a workspace member directly at the repo
# root when its dir name equals the inner package name (`<root>/utils/utils/`)
# causes pytest's importlib collection to resolve `import utils` to a PEP 420
# namespace package at the outer dir, shadowing the real package. Wrapping in
# `packages/` keeps the outer dir off sys.path's namespace-search candidates.
[tool.uv.workspace]
members = [
    "packages/eval-bot",
    "packages/eval-tools",
    "packages/game-runner",
    "packages/game-types",
    "replay-collector",
    "replay-parser",
    "packages/self-play",
    "packages/settings",
    "sim-core",
    "packages/training",
    "packages/utils",
]

[tool.uv.sources]
eval-bot = { workspace = true }
eval-tools = { workspace = true }
game-runner = { workspace = true }
game-types = { workspace = true }
replay-collector = { workspace = true }
replay-parser = { workspace = true }
self-play = { workspace = true }
settings = { workspace = true }
sim-core = { workspace = true }
training = { workspace = true }
utils = { workspace = true }

[dependency-groups]
dev = [
    "drawsvg>=2.4.1",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.14.0",
    "tabulate>=0.10.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["replay-parser/tests", "tools"]
testpaths = [
    "packages/eval-bot/tests",
    "packages/eval-tools/tests",
    "packages/game-runner/tests",
    "replay-collector/tests",
    "replay-parser/tests",
    "packages/self-play/tests",
    "packages/training/tests",
    "packages/utils/tests",
    # Cross-cutting tests with no owning workspace package (e.g. the tools/
    # model-arch diagram ↔ live-model consistency guard).
    "tests",
]

# Ruff config lives in `ruff.toml`.
# Pyright config lives in `pyrightconfig.json`.
