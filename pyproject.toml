[project]
name = "generals-ai-workspace"
version = "0.0.0"
description = "generals-ai monorepo workspace root"
requires-python = ">=3.14"
dependencies = [
    "modal>=1.4.3",
    "cloud-train-poc",
    "replay-collector",
    "replay-parser",
    "self-play",
    "sim-core",
    "training",
    "utils",
]

[tool.uv]
package = false

# Convention: new shared/leaf packages go under `packages/` (e.g.
# `packages/utils/utils/`). Putting a workspace member directly at the repo
# root when its dir name equals the inner package name (`<root>/utils/utils/`)
# causes pytest's importlib collection to resolve `import utils` to a PEP 420
# namespace package at the outer dir, shadowing the real package. Wrapping in
# `packages/` keeps the outer dir off sys.path's namespace-search candidates.
[tool.uv.workspace]
members = [
    "cloud-poc",
    "replay-collector",
    "replay-parser",
    "packages/self-play",
    "sim-core",
    "training",
    "packages/utils",
]

[tool.uv.sources]
cloud-train-poc = { workspace = true }
replay-collector = { workspace = true }
replay-parser = { workspace = true }
self-play = { workspace = true }
sim-core = { workspace = true }
training = { workspace = true }
utils = { workspace = true }

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.14.0",
    "tabulate>=0.10.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["replay-parser/tests"]
testpaths = [
    "replay-collector/tests",
    "replay-parser/tests",
    "packages/self-play/tests",
    "training/tests",
    "packages/utils/tests",
]

# Ruff config lives in `ruff.toml`.
# Pyright config lives in `pyrightconfig.json`.
