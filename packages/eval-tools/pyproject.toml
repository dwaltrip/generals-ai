[project]
name = "eval-tools"
version = "0.0.1"
description = "Eval tooling for generals-ai: policy spec parsing, metrics collection, saved-game viewer"
requires-python = ">=3.14"
dependencies = [
    "eval-bot",
    "game-runner",
    "game-types",
    "numpy>=2.0",
    "self-play",
    "sim-core",
    "utils",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_tools"]

[tool.uv.sources]
eval-bot = { workspace = true }
game-runner = { workspace = true }
game-types = { workspace = true }
self-play = { workspace = true }
sim-core = { workspace = true }
utils = { workspace = true }
