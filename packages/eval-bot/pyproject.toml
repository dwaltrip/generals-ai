[project]
name = "eval-bot"
version = "0.0.1"
description = "Hand-coded greedy bot for evaluating NN training progress"
requires-python = ">=3.14"
dependencies = [
    "game-runner",
    "game-types",
    "numpy>=2.0",
    "sim-core",
    "self-play",
    # TODO: cross-package dep on training internals (bc.obs, bc.visibility).
    # The eval bot reuses MemoryState + step_memory for fog tracking rather
    # than reimplementing. Extract a shared fog-tracking module if this
    # coupling becomes painful.
    "training",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_bot"]

[tool.uv.sources]
game-runner = { workspace = true }
game-types = { workspace = true }
self-play = { workspace = true }
sim-core = { workspace = true }
training = { workspace = true }
