[project]
name = "self-play"
version = "0.0.1"
description = "Self-play prototype: two model instances play a generals.io game through sim_core, renderable in the timestep viewer"
requires-python = ">=3.14"
dependencies = [
    "game-runner",
    "game-types",
    "numpy>=2.0",
    "replay-collector",
    "replay-parser",
    "sim-core",
    "training",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["self_play"]

[tool.uv.sources]
game-runner = { workspace = true }
game-types = { workspace = true }
replay-collector = { workspace = true }
replay-parser = { workspace = true }
sim-core = { workspace = true }
training = { workspace = true }
