[project]
name = "game-types"
version = "0.0.0"
description = "Dependency-light data contracts shared across the game/model boundary"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["game_types"]
