[project]
name = "training"
version = "0.1.0"
description = "Training pipelines for the generals.io model (BC now; PPO self-play later)"
requires-python = ">=3.14"
dependencies = [
    "game-types",
    "matplotlib>=3.10.9",
    # NVML backend for `torch.cuda.utilization()` (the gpu-util sidecar).
    # torch imports it as `pynvml`, but the distribution it checks for is
    # `nvidia-ml-py` — not the colliding third-party `pynvml` package.
    "nvidia-ml-py>=12.0",
    "numpy>=2.0",
    "torch>=2.12",
    "utils",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bc", "shared"]  # will extend to ppo as that lands
