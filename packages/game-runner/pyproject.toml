[project]
name = "game-runner"
version = "0.0.1"
description = "Generic game runner: Policy protocol, N-player game loop, map loading, and replay viewer for generals.io sim_core"
requires-python = ">=3.14"
dependencies = [
    "game-types",
    "numpy>=2.0",
    "replay-collector",
    "replay-parser",
    "settings",
    "sim-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["game_runner"]

[tool.uv.sources]
game-types = { workspace = true }
replay-collector = { workspace = true }
replay-parser = { workspace = true }
settings = { workspace = true }
sim-core = { workspace = true }
