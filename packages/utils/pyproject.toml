[project]
name = "utils"
version = "0.0.0"
description = "Cross-package shared helpers for the generals-ai workspace"
requires-python = ">=3.14"
dependencies = [
    "tabulate>=0.10.0",  # utils.format.md_table
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]
