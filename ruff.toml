line-length = 100
extend-exclude = ["**/_archive/"]

[lint]
select = ["F", "E", "W", "I", "B", "UP", "TID"]

ignore = ["B028"]

[lint.isort]
force-sort-within-sections = true
known-first-party = [
    "bc",
    "eval_bot",
    "eval_tools",
    "game_runner",
    "game_types",
    "replay_collector",
    "replay_parser",
    "self_play",
    "sim_core",
    "training",
    "utils",
]
known-local-folder = ["_sweep_common", "_fixture_lib", "_helpers"]
lines-after-imports = 2

[lint.flake8-tidy-imports.banned-api]
"replay_collector".msg = "Import via replay_parser._collector.* instead of replay_collector directly"

[lint.per-file-ignores]
"replay-parser/replay_parser/_collector/**/*.py" = ["TID251"]
"replay-collector/**/*.py" = ["TID251"]
"packages/game-runner/**/*.py" = ["TID251"]
