# Minimal workspace root used INSIDE the Modal image.
# Copied to /workspace/pyproject.toml at image-build time.
#
# Mirrors the real root pyproject.toml but drops all workspace members the POC
# doesn't need — keeps the image surface area minimal while still exercising
# the "uv sync in a Modal image" mechanism end-to-end.
[project]
name = "modal-workspace"
version = "0.0.0"
description = "Stand-in workspace root for Modal image (POC)"
requires-python = ">=3.14"
dependencies = [
    "cloud-train-poc",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["cloud-poc"]

[tool.uv.sources]
cloud-train-poc = { workspace = true }
