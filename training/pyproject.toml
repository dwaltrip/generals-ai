[project]
name = "training"
version = "0.1.0"
description = "Training pipelines for the generals.io model (BC now; PPO self-play later)"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0",
    "torch>=2.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bc", "shared"]  # will extend to ppo as that lands
